<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix it Cup-Teamauswahl</title>
    <link rel="stylesheet" href="spreadsheet.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .settings {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .setting {
            flex: 1;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .team-card:hover {
            transform: translateY(-5px);
        }

        .team-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2em;
        }

        .team-member {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;
            color: #333;
        }

        .member-uni {
            font-size: 0.85em;
            color: #666;
        }

        .stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .top-nav {
            width: 100%;
            padding: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-left: 30px;
            padding-left: 30px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
        }

        .nav-links-left {
            display: flex;
            align-items: center;
        }

        .nav-links-left .nav-link {
            margin-left: 30px;
        }

        .nav-links-right {
            display: flex;
            align-items: center;
            margin-right: 30px;
        }

        .nav-links-right .nav-link {
            padding-left: 30px;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-links-left">
        </div>
        <div class="nav-links-right">
            <a href="https://github.com/mixitcup/auswahl" target="_blank" class="nav-link">
                Quelltext
            </a>
        </div>
    </nav>

    <div class="container">
        <h1>🏆 Mix it Cup-Teamauswahl</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="registrationsFile">Meldungen importieren (.xlsx)</label>
                <p id="fileHint">Tabellenblatt „Meldungen“ mit den Spalten Uni, Name und Pflicht in Zeile 1.</p>
                <input type="file" id="registrationsFile" accept=".xlsx" aria-describedby="fileHint">
                <button type="button" id="resetBtn" hidden>Zurücksetzen</button>
                <p id="importStatus" role="status"></p>
                <div id="preview" hidden>
                    <table>
                        <caption>Importierte Meldungen</caption>
                        <thead><tr><th>Uni</th><th>Name</th><th>Pflicht</th></tr></thead>
                        <tbody id="previewRows"></tbody>
                    </table>
                </div>
            </div>
            <div id="error" class="error" role="alert" hidden></div>

            <div class="settings">
                <div class="setting">
                    <label for="teamSize">Maximale Teamgröße</label>
                    <input type="number" id="teamSize" value="4" min="2" max="20" required>
                </div>
                <div class="setting">
                    <label for="seed">Zufallsstartwert</label>
                    <input type="text" id="seed" placeholder="Optional">
                </div>
            </div>
            
            <button type="button" id="generateBtn" disabled>Teams erstellen</button>
            <button type="button" id="exportTeamsBtn" hidden>Teams als XLSX herunterladen</button>
        </div>
        
        <div id="stats" class="stats" hidden>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalPeople">0</div>
                    <div class="stat-label">Teilnehmende</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalTeams">0</div>
                    <div class="stat-label">Teams</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalLevels">0</div>
                    <div class="stat-label">Level</div>
                </div>
            </div>
        </div>
        
        <div id="teamsContainer" class="teams-container"></div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js" integrity="sha384-NG/W3xvO3ynQEcDQYIOcZTXRtwUs83cLv1FIl9PuqWPDuNhsMRF6wutlNLFwlb71" crossorigin="anonymous"></script>
    <script src="spreadsheet.js"></script>
    <script src="app.js"></script>
</body>
</html>
